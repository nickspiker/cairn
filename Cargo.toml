[package]
name = "cairn"
version = "0.0.0"
edition = "2024"

[dependencies]
vsf = { path = "../vsf", features = ["text", "crypto"] }
blake3 = "1.5"
chrono = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.8"

[features]
inspect = ["vsf/inspect"]
