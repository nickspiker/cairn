[package]
name = "cairn"
version = "0.0.0"
edition = "2024"
authors = ["Nick Spiker"]
description = "Build-gated version control for Rust projects - EXPERIMENTAL, NOT PRODUCTION READY"
readme = "README.md"
homepage = "https://github.com/nickspiker/cairn"
repository = "https://github.com/nickspiker/cairn"
license = "MIT OR Apache-2.0"
keywords = ["version-control", "build", "snapshot", "vcs", "cargo"]
categories = ["development-tools", "command-line-utilities"]
exclude = [
    "vscode-extension/",
    ".cairn/",
    "examples/",
    "release-v0.0.0/",
    "resources/",
]

[lib]
name = "cairn"
path = "src/lib.rs"

[[bin]]
name = "cairn"
path = "src/main.rs"

[[bin]]
name = "cargo-cairn"
path = "src/bin/cargo-cairn.rs"

[dependencies]
vsf = { version = "0.2.3", features = ["text", "crypto"] }
blake3 = "1.5"
chrono = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
base64 = "0.22"
bincode = "1.3"
ignore = "0.4"
diffy = "0.4"
serde = { version = "1.0", features = ["derive"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.8"

[features]
inspect = ["vsf/inspect"]
